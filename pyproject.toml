[tool.poetry]
name = "portfolio-starter"
version = "0.1.0"
description = "Starter template for AI/ML/LLM portfolio projects with algorithms and cert prep"
authors = ["Shivank"]
readme = "README.md"
packages = [{ include = "portfolio_starter", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.2.2"
numpy = "^2.0.1"
pydantic = "^2.8.2"
requests = "^2.32.3"
streamlit = "^1.37.0"
fastapi = "^0.112.0"
uvicorn = "^0.30.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
ruff = "^0.5.6"
mypy = "^1.10.0"
pytest = "^8.2.0"
nbstripout = "^0.7.1"
pre-commit = "^3.7.1"
bandit = "^1.7.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
exclude = '^(algorithms/|tests/algorithms/)'